spring.application.name=baitapSession14
spring.config.import=optional:file:../.local-config/baitapSession14.properties,optional:file:./config/application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/security_session14}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Base64-encoded key (at least 32 random bytes), supplied by local config or environment.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
